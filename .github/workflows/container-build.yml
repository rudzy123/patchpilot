name: Container build

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: container-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  deferred:
    name: Deferred
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Confirm runtime Dockerfiles remain deferred
        run: |
          mapfile -t dockerfiles < <(git ls-files '*Dockerfile' '*Dockerfile.*' '*.dockerfile')
          if ((${#dockerfiles[@]} > 0)); then
            printf 'Runtime Dockerfiles are present:\n'
            printf '%s\n' "${dockerfiles[@]}"
            printf 'Replace this deferred job with a BuildKit build-without-push workflow. Do not push images in Session 4.\n'
            exit 1
          fi
          printf 'No runtime Dockerfiles are tracked. Container image validation is deferred to the deployment milestone.\n'
