name: SBOM

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Generate repository CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: patchpilot-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Inspect generated SBOM for credential-like strings
        run: |
          if [[ ! -f patchpilot-sbom.cdx.json ]]; then
            printf 'Expected patchpilot-sbom.cdx.json was not created.\n'
            exit 1
          fi
          if grep -Eiq 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' patchpilot-sbom.cdx.json; then
            printf 'Generated SBOM matched a credential-like pattern. Do not publish it.\n'
            exit 1
          fi
          printf 'No credential-like patterns matched in the generated SBOM.\n'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patchpilot-sbom-${{ github.run_id }}-${{ github.run_attempt }}
          path: patchpilot-sbom.cdx.json
          retention-days: 7
