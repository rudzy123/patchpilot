# Local Docker Compose for PostgreSQL, Redis, and MinIO.
# Development-only placeholder credentials. Unfit for production.
# Applications (web, api, worker) are started with `pnpm dev`, not this file.

name: patchpilot

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PATCHPILOT_POSTGRES_PORT:-55432}:5432'
    environment:
      POSTGRES_USER: patchpilot
      POSTGRES_PASSWORD: patchpilot-dev-not-for-production
      POSTGRES_DB: patchpilot
    volumes:
      - patchpilot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U patchpilot -d patchpilot']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PATCHPILOT_REDIS_PORT:-16379}:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - patchpilot_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r3@sha256:953d489a81cc4de7975f90e07202189c4325da39b0b92470b6a13c7ea99e36cd
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PATCHPILOT_MINIO_API_PORT:-19000}:9000'
      - '127.0.0.1:${PATCHPILOT_MINIO_CONSOLE_PORT:-19001}:9001'
    environment:
      MINIO_ROOT_USER: patchpilot-dev-access
      MINIO_ROOT_PASSWORD: patchpilot-dev-secret-not-for-production
    volumes:
      - patchpilot_minio:/bitnami/minio/data
    healthcheck:
      # This pinned image includes curl. Do not switch tags without confirming the healthcheck binary exists.
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  patchpilot_postgres:
  patchpilot_redis:
  patchpilot_minio:
